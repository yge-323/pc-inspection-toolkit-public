name: Core offline tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prepare isolated synthetic-test workspace
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path work | Out-Null
      - name: Select Git bundled POSIX Perl when available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitCommand = Get-Command git -ErrorAction SilentlyContinue
          if ($gitCommand) {
            $gitRoot = Split-Path (Split-Path $gitCommand.Source -Parent) -Parent
            $gitPerl = Join-Path $gitRoot 'usr\bin\perl.exe'
            if (Test-Path -LiteralPath $gitPerl -PathType Leaf) {
              "PC_INSPECTION_TEST_PERL=$gitPerl" >> $env:GITHUB_ENV
              Write-Host 'Selected Git bundled Perl for POSIX capability probe.'
            }
          }
      - name: Run core offline regression
        run: python -B tests/run_unit_tests.py
      - name: Run restart build contracts
        run: python -B tests/test_restart_build.py
